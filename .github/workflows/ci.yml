name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(find . -type f -name '*.go'))"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:"
            printf '%s\\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: go build ./cmd/federation-api
