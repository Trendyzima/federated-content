name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: federation
          POSTGRES_PASSWORD: federation-test-password
          POSTGRES_DB: federation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U federation -d federation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FEDERATION_TEST_DATABASE_URL: postgres://federation:federation-test-password@localhost:5432/federation_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(find . -type f -name '*.go'))"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt; formatter diff follows:"
            printf '%s\n' "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: go build ./cmd/federation-api
