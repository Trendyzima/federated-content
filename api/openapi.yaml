openapi: 3.1.0
info:
  title: Testagram Federated Content API
  version: 0.1.0
  description: Public ActivityPub discovery and actor endpoints. Inbox requests require valid ActivityPub HTTP Signatures, eligible local recipients, bounded payloads and durable database acceptance.
servers:
  - url: https://federation.testagram.site
paths:
  /healthz:
    get:
      operationId: health
      summary: Process liveness
      responses:
        "200":
          description: Process is alive
  /readyz:
    get:
      operationId: readiness
      summary: Service readiness
      responses:
        "200":
          description: Federation database and private Backend identity dependency are reachable
  /.well-known/webfinger:
    get:
      operationId: webfinger
      summary: Resolve the configured service actor
      parameters:
        - in: query
          name: resource
          required: true
          schema:
            type: string
            example: acct:testagram@testagram.site
      responses:
        "200":
          description: JRD account descriptor
          content:
            application/jrd+json:
              schema:
                type: object
        "404":
          description: Account is not hosted by this service
        "503":
          description: Private Backend actor eligibility lookup is unavailable
  /users/{username}:
    get:
      operationId: getActor
      summary: Fetch the configured ActivityPub actor
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            example: application/activity+json
      responses:
        "200":
          description: ActivityPub actor document
          content:
            application/activity+json:
              schema:
                type: object
        "404":
          description: Actor not found
        "406":
          description: ActivityPub Accept header required
  /users/{username}/outbox:
    get:
      operationId: getOutbox
      summary: Fetch the eligible actor's paginated ActivityPub outbox
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OrderedCollection containing durably accepted outbound activities
          content:
            application/activity+json:
              schema:
                type: object
        "404":
          description: Actor not found
        "503":
          description: Private Backend actor eligibility or durable outbox storage is unavailable
  /users/{username}/inbox:
    post:
      operationId: receiveActivity
      summary: Receive a signed ActivityPub activity for an eligible local actor
      description: Requires an ActivityPub HTTP Signature whose key owner matches the activity actor. The local actor's Federation consent and identity are rechecked immediately before the activity is durably persisted. Duplicate activity IDs are acknowledged idempotently.
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/activity+json:
            schema:
              type: object
              required: [id, type, actor]
              properties:
                id: { type: string, format: uri }
                type: { type: string }
                actor: { type: string, format: uri }
      responses:
        "202":
          description: Activity durably accepted or acknowledged as a duplicate
        "400":
          description: Activity identity or actor/signature binding is invalid
        "401":
          description: ActivityPub HTTP Signature is invalid
        "404":
          description: Local actor does not exist, has opted out, or changed during validation
        "413":
          description: Activity exceeds the one-megabyte request limit
        "415":
          description: ActivityPub content type is required
        "422":
          description: Activity type is not supported
        "503":
          description: Backend actor eligibility or durable Federation persistence is unavailable
